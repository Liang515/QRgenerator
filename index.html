<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>QR Gen Studio - QR Code 產生器</title>
    <!-- 狀態列背後的顏色：與手機版標題列同為白色 -->
    <meta name="theme-color" content="#FFFFFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="QR Gen">
    <link rel="apple-touch-icon" href="./icons/icon-180.png">
    <link rel="icon" type="image/png" href="./icons/icon-192.png">
    <link rel="manifest" href="./manifest.json">

    <!-- Google Fonts: Plus Jakarta Sans 用於數字與英文，Noto Sans TC 用於中文 (離線時會退回系統字型) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>

<!-- iOS 26 從主畫面開啟時，會在畫面頂端與底端約 40pt 疊一層霧化（scroll edge effect），
     沒有 meta 能關。WebKit 只在邊緣有「固定、全寬、高於 10px、單一底色」的元素時不加霧化，
     改把該顏色延伸進系統區域。這兩條就是那個元素：background-clip:text 又沒有文字，所以看不見。
     用 inline style 是為了第一個畫面就生效 (做法取自 typhoon-cast)。 -->
<div class="edge-band" aria-hidden="true" style="position:fixed;top:0;left:0;right:0;height:12px;background-color:#ffffff;-webkit-background-clip:text;background-clip:text;pointer-events:none;z-index:2147483647"></div>
<div class="edge-band" aria-hidden="true" style="position:fixed;bottom:0;left:0;right:0;height:12px;background-color:#ffffff;-webkit-background-clip:text;background-clip:text;pointer-events:none;z-index:2147483647"></div>
<!-- 狀態列後方的白底：往下捲時內容躲在它後面，不會透到時間與電量底下 (瀏覽器分頁中高度為 0) -->
<div class="status-shield" aria-hidden="true"></div>

<div class="toast" id="toastBox" role="status" aria-live="polite">
    <span id="toastIcon">✨</span>
    <span id="toastText"></span>
</div>

<div class="app-container">
    <!-- 左側設定控制面板 -->
    <div class="controls">
        <!-- 頂部 Header -->
        <header class="app-header">
            <img id="headerLogo" alt="QR Gen Studio Logo">
            <div>
                <h2>QR Gen Studio</h2>
                <p class="subtitle">輸入網址，產生可下載的 QR Code 圖片</p>
            </div>
        </header>

        <!-- 設定分頁 -->
        <div class="tabs" role="tablist" aria-label="設定">
            <button type="button" class="tab-btn" role="tab" id="tab-content" data-tab="content" aria-controls="panel-content" aria-selected="true">內容</button>
            <button type="button" class="tab-btn" role="tab" id="tab-style" data-tab="style" aria-controls="panel-style" aria-selected="false">配色</button>
            <button type="button" class="tab-btn" role="tab" id="tab-size" data-tab="size" aria-controls="panel-size" aria-selected="false">尺寸</button>
            <button type="button" class="tab-btn" role="tab" id="tab-logo" data-tab="logo" aria-controls="panel-logo" aria-selected="false">LOGO</button>
        </div>

        <section class="panel is-active" id="panel-content" role="tabpanel" aria-labelledby="tab-content">
            <h3 class="panel-title">內容</h3>
            <div class="input-group">
                <label for="urlInput">目標網址 (URL) 或文字</label>
                <div class="input-with-actions">
                    <input type="text" id="urlInput" value="https://google.com" placeholder="https://yourdomain.com" inputmode="url" autocomplete="url" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
                    <div class="input-actions">
                        <button type="button" class="icon-btn" id="pasteBtn" hidden>貼上</button>
                        <button type="button" class="icon-btn subtle" id="clearUrlBtn" aria-label="清除網址">✕</button>
                    </div>
                </div>
            </div>
            <div class="input-group">
                <label for="descInput">底部描述文字</label>
                <textarea id="descInput" rows="2" placeholder="輸入要顯示在下方的宣傳文字">請掃描進入官方網站</textarea>
                <span class="field-hint">可按 Enter 手動換行</span>
            </div>
        </section>

        <section class="panel" id="panel-style" role="tabpanel" aria-labelledby="tab-style">
            <h3 class="panel-title">配色</h3>
            <!-- 快速預設組合 (由 presets.ts 產生) -->
            <div class="input-group">
                <label>配色預設</label>
                <div class="preset-grid" id="presetGrid"></div>
            </div>

            <!-- 自訂條碼色彩 -->
            <div class="input-group">
                <label>條碼色彩配置</label>
                <div class="color-row">
                    <div class="color-item">
                        <label class="sub-label" for="qrColorDark">條碼前景色 (Dark)</label>
                        <div class="color-picker-wrapper">
                            <div class="color-preview-block" id="qrDarkPreview"></div>
                            <span class="color-hex-text" id="qrDarkHex"></span>
                            <input type="color" id="qrColorDark" value="#2D3A44">
                        </div>
                    </div>
                    <div class="color-item">
                        <label class="sub-label" for="qrColorLight">條碼背景色 (Light)</label>
                        <div class="color-picker-wrapper">
                            <div class="color-preview-block" id="qrLightPreview"></div>
                            <span class="color-hex-text" id="qrLightHex"></span>
                            <input type="color" id="qrColorLight" value="#FAF8F5">
                        </div>
                    </div>
                </div>
                <div class="contrast-warning" id="contrastWarning" role="alert"></div>
            </div>

            <!-- 自訂畫布色彩 -->
            <div class="input-group">
                <label>整體畫布色彩</label>
                <div class="color-row">
                    <div class="color-item">
                        <label class="sub-label" for="textColor">文字顏色 (Text)</label>
                        <div class="color-picker-wrapper">
                            <div class="color-preview-block" id="textColPreview"></div>
                            <span class="color-hex-text" id="textColHex"></span>
                            <input type="color" id="textColor" value="#2D3A44">
                        </div>
                    </div>
                    <div class="color-item">
                        <label class="sub-label" for="bgColor">海報背景色 (Canvas)</label>
                        <div class="color-picker-wrapper">
                            <div class="color-preview-block" id="bgColPreview"></div>
                            <span class="color-hex-text" id="bgColHex"></span>
                            <input type="color" id="bgColor" value="#FAF8F5">
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="panel" id="panel-size" role="tabpanel" aria-labelledby="tab-size">
            <h3 class="panel-title">尺寸與版面</h3>
            <div class="input-group">
                <label for="qrSlider">QR Code 大小 <span id="qrVal">280</span></label>
                <input type="range" id="qrSlider" min="180" max="500" value="280">
            </div>
            <div class="input-group">
                <label for="fontSlider">描述文字大小 <span id="fontVal">22</span></label>
                <input type="range" id="fontSlider" min="14" max="50" value="22">
            </div>
            <div class="input-group">
                <label for="gapSlider">條碼文字垂直間隔 <span id="gapVal">25</span></label>
                <input type="range" id="gapSlider" min="10" max="80" value="25">
            </div>
        </section>

        <section class="panel" id="panel-logo" role="tabpanel" aria-labelledby="tab-logo">
            <h3 class="panel-title">中心 LOGO</h3>
            <div class="input-group">
                <label>標誌展示模式</label>
                <div class="logo-mode-grid" role="radiogroup" aria-label="標誌展示模式">
                    <button type="button" class="logo-mode-btn" data-mode="default" role="radio">預設 LOGO</button>
                    <button type="button" class="logo-mode-btn" data-mode="custom" role="radio">自訂圖片</button>
                    <button type="button" class="logo-mode-btn" data-mode="none" role="radio">不使用</button>
                </div>
            </div>

            <!-- 上傳區 (custom 模式才顯示) -->
            <div class="input-group" id="uploadGroup" hidden>
                <label for="logoInput">上傳中心 LOGO</label>
                <div class="file-upload-wrapper">
                    <input type="file" id="logoInput" accept="image/*">
                    <div class="file-upload-text">
                        <span id="uploadStatusMain">拖放圖片至此或 <b>點擊瀏覽</b></span><br>
                        <span id="uploadStatusSub" style="font-size:11px; opacity:0.7;">支援 PNG, JPG, SVG</span>
                    </div>
                </div>
            </div>

            <div class="input-group logo-option">
                <label for="logoSlider">Logo 大小比例 <span id="logoVal">22%</span></label>
                <input type="range" id="logoSlider" min="15" max="30" value="22">
            </div>
            <div class="input-group logo-option">
                <label for="logoRadiusSlider">Logo 圓角弧度 <span id="logoRadiusVal">14</span></label>
                <input type="range" id="logoRadiusSlider" min="0" max="25" value="14">
            </div>
            <div class="input-group logo-option">
                <label for="logoZoomSlider">Logo 縮放裁剪 <span id="logoZoomVal">1.00x</span></label>
                <input type="range" id="logoZoomSlider" min="1.0" max="1.5" step="0.05" value="1.00">
            </div>
        </section>

        <!-- 操作按鈕列 -->
        <div class="action-row" id="actionRow">
            <button type="button" class="btn-share" id="shareBtn" hidden>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
                分享
            </button>
            <button type="button" class="btn-down" id="downloadBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                下載
            </button>
            <button type="button" class="btn-copy" id="copyBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                複製
            </button>
        </div>
    </div>

    <!-- 右側預覽畫布 -->
    <div class="preview" id="previewArea">
        <div class="preview-grid-bg"></div>

        <!-- 畫布上方控制工具 -->
        <div class="preview-toolbar">
            <button type="button" class="toolbar-btn active" id="gridToggle" aria-pressed="true">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line></svg>
                輔助網格
            </button>
            <span class="toolbar-divider"></span>
            <span class="toolbar-badge">
                <span class="pulse-dot"></span>
                即時預覽
            </span>
        </div>

        <div class="qr-error" id="qrError" role="alert"></div>
        <div class="canvas-container">
            <canvas id="mainCanvas" aria-label="QR Code 海報預覽"></canvas>
        </div>
    </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
